[package]
name = "ade-db"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
ade-core = { path = "../core" }
turso = { workspace = true }
# Transitive dep of turso_core; `pure-rust` avoids needing clang-cl on Windows MSVC.
aegis = { version = "0.9", features = ["pure-rust"] }
rusqlite = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
