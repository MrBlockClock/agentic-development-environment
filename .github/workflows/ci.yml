name: CI

on:
  push:
    branches: ["main", "master", "cursor/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches .cargo/config.toml target-dir (sibling of the checkout).
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Show pinned Rust toolchain
        run: rustc --version --verbose

      - name: Cursor guidance mirror check
        shell: pwsh
        run: ./scripts/sync-cursor-guidance.ps1 -Check

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Share registry/target across Rust + G4 on the same OS.
          shared-key: ade-${{ runner.os }}
          workspaces: ". -> ../ade-target"
          cache-on-failure: "true"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ade-desktop-app --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --exclude ade-desktop-app

      - name: Ideal ADE gold-set eval
        run: cargo run -p ade-cli --quiet -- eval --gold

  desktop:
    name: Desktop frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Desktop unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Desktop Playwright (IA + Analytics + Agent composer)
        run: npx playwright test e2e/sidebar-ia.spec.ts e2e/insight-analytics.spec.ts e2e/agent-composer.spec.ts
        env:
          CI: "true"

  g4:
    name: G4 integration gate
    runs-on: windows-latest
    # Rust/desktop already cover fmt/clippy/tests/tsc/npm build; G4 is API smoke only.
    needs: [rust, desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Show pinned Rust toolchain
        run: rustc --version --verbose

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ade-${{ runner.os }}
          workspaces: ". -> ../ade-target"
          cache-on-failure: "true"

      - name: Run G4 API integration smoke
        shell: powershell
        run: ./scripts/verify-g4.ps1
