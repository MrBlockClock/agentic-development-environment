[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/agents",
    "crates/api",
    "crates/core",
    "crates/db",
    "crates/desktop",
    "crates/plugins",
    "crates/service",
    "crates/workflow",
]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
daemon-kit = "0.1"
dotenvy = "0.15"
keyring = "3"
reqwest = "0.12"
rmcp = "0.1"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
turso = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = "24"
