[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/agents",
    "crates/api",
    "crates/core",
    "crates/db",
    "crates/desktop",
    "crates/plugins",
    "crates/service",
    "crates/workflow",
]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
chrono = "0.4"
clap = "4"
daemon-kit = "0.1"
keyring = "3"
reqwest = "0.12"
rmcp = "0.1"
rusqlite = "0.32"
serde = "1"
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = "1"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
turso = "0.3"
uuid = "1"
wasmtime = "24"
