[package]
name = "ade-desktop-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "ade_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embed frontendDist so `ade-desktop-app.exe` works without Vite on :1420.
# `tauri dev` disables this for HMR against devUrl.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ade-core = { path = "../../../crates/core" }
ade-desktop-crate = { path = "../../../crates/desktop" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
